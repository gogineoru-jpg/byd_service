<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование - BYD help</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .brand-red { color: #dc3545; font-weight: 800; }
        .brand-help { color: #ffffff; font-weight: 400; font-style: italic; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fs-4" href="/">
                <i class="bi bi-ev-front me-2 text-danger"></i><span class="brand-red">BYD</span> <span class="brand-help">help</span>
            </a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> На главную</a>
        </div>
    </nav>

    <div class="container mb-5" style="max-width: 800px;">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2 text-warning"></i> Редактирование записи №{{ car.id }}</h5>
            </div>
            <div class="card-body p-4">
                <form action="/update-car/{{ car.id }}" method="post">
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-danger">Филиал</label>
                            <select name="filial" class="form-select fw-bold">
                                {% for f in filials %}
                                    <option value="{{ f }}" {% if car.filial == f %}selected{% endif %}>{{ f }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Текущий статус</label>
                            <select name="status" class="form-select fw-bold">
                                <option value="Принято" {% if car.status == 'Принято' %}selected{% endif %}>🔵 Принято</option>
                                <option value="В работе" {% if car.status == 'В работе' %}selected{% endif %}>🟡 В работе</option>
                                <option value="Готово" {% if car.status == 'Готово' %}selected{% endif %}>🟢 Готово</option>
                                <option value="Выдано" {% if car.status == 'Выдано' %}selected{% endif %}>⚪ Выдано</option>
                            </select>
                        </div>
                    </div>

                    <h6 class="fw-bold text-uppercase text-muted border-bottom pb-2 mb-3">Данные владельца</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">ФИО Клиента *</label>
                            <input type="text" name="full_name" class="form-control" value="{{ car.owner.full_name if car.owner else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Номер телефона *</label>
                            <input type="text" name="phone" class="form-control" value="{{ car.owner.phone if car.owner else '' }}" required>
                        </div>
                    </div>

                    <h6 class="fw-bold text-uppercase text-muted border-bottom pb-2 mb-3">Данные автомобиля</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Марка и Модель *</label>
                            <input type="text" name="brand_model" class="form-control" value="{{ car.brand_model }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Гос. Номер *</label>
                            <input type="text" name="plate_number" class="form-control font-monospace" value="{{ car.plate_number }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">VIN-код *</label>
                            <input type="text" name="vin_code" class="form-control font-monospace" value="{{ car.vin_code }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Тип привода</label>
                            <select name="engine_type" class="form-select">
                                <option value="Электро (EV)" {% if car.engine_type == 'Электро (EV)' %}selected{% endif %}>Электро (EV)</option>
                                <option value="Гибрид (DM-i)" {% if car.engine_type == 'Гибрид (DM-i)' %}selected{% endif %}>Гибрид (DM-i)</option>
                                <option value="Гибрид (DM-p)" {% if car.engine_type == 'Гибрид (DM-p)' %}selected{% endif %}>Гибрид (DM-p)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Пробег (км)</label>
                            <input type="number" name="mileage" class="form-control" value="{{ car.mileage }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Год выпуска</label>
                            <input type="number" name="manufacture_year" class="form-control" value="{{ car.manufacture_year }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">SOH Батареи (%)</label>
                            <input type="number" step="0.1" name="soh_percent" class="form-control" value="{{ car.soh_percent }}">
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark btn-lg fw-bold"><i class="bi bi-save me-1"></i> Сохранить изменения</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
