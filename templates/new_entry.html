<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация нового автомобиля — BYD Help</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; background-color: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 750px; margin: 0 auto; }
        
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .card-header { background: #222; border-bottom: 2px solid #d32f2f; padding: 15px 20px; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        .form-body { padding: 25px; }
        .section-title { font-size: 11px; text-transform: uppercase; color: #888; font-weight: bold; margin-bottom: 12px; margin-top: 15px; letter-spacing: 0.5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .section-title:first-child { margin-top: 0; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        
        label { display: block; font-size: 12px; color: #ccc; margin-bottom: 6px; font-weight: bold; }
        input, select { width: 100%; padding: 10px 12px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 14px; }
        input:focus, select:focus { border-color: #d32f2f; outline: none; }

        .btn-submit { width: 100%; padding: 12px; background: #d32f2f; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 25px; }
        .btn-submit:hover { background: #b71c1c; }
        
        .btn-back { color: #888; text-decoration: none; font-size: 13px; font-weight: normal; }
        .btn-back:hover { color: #fff; }

        .calc-box { background: #262626; border: 1px solid #3d3d3d; padding: 12px; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <span>⊕ Регистрация нового автомобиля</span>
            <a href="/" class="btn-back">← На главную</a>
        </div>
        
        <form action="/create-entry" method="post" class="form-body">
            
            <div class="section-title">📍 Филиал обслуживания *</div>
            <div class="full-width" style="margin-bottom: 15px;">
                <select name="filial" required>
                    {% for f in filials %}
                    <option value="{{ f }}">{{ f }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="section-title">ДАННЫЕ ВЛАДЕЛЬЦА</div>
            <div class="form-grid">
                <div>
                    <label>ФИО Клиента *</label>
                    <input type="text" name="full_name" placeholder="Иван Иванов" required>
                </div>
                <div>
                    <label>Номер телефона *</label>
                    <input type="text" name="phone" placeholder="+998 90 123 45 67" required>
                </div>
            </div>

            <div class="section-title">ДАННЫЕ ЭЛЕКТРОМОБИЛЯ / ГИБРИДА BYD</div>
            <div class="form-grid">
                <div>
                    <label>Марка и Модель *</label>
                    <input type="text" name="brand_model" placeholder="BYD Song Plus EV / DM-i" value="BYD Song Plus" required>
                </div>
                <div>
                    <label>Гос. Номер *</label>
                    <input type="text" name="plate_number" placeholder="01 A 777 AA" required style="text-transform: uppercase;">
                </div>

                <div>
                    <label>VIN-код *</label>
                    <input type="text" name="vin_code" placeholder="LC0..." required style="text-transform: uppercase;">
                </div>
                <div>
                    <label>Тип привода / Двигателя</label>
                    <select name="engine_type">
                        <option value="Гибрид (DM-i / DM-p)">Гибрид (DM-i / DM-p)</option>
                        <option value="Электро (EV)">Электро (EV)</option>
                        <option value="ДВС (Бензин)">ДВС (Бензин)</option>
                    </select>
                </div>

                <div>
                    <label>Год выпуска</label>
                    <input type="number" name="manufacture_year" value="2023" required>
                </div>
                <div>
                    <label>SOH Батареи (%)</label>
                    <input type="number" name="soh_percent" value="100.0" step="0.1" required>
                </div>
            </div>

            <!-- Разделенный пробег EV / HEV / ODO -->
            <div class="section-title">ПОКАЗАНИЯ ПРОБЕГА (КМ)</div>
            <div class="calc-box">
                <div class="form-grid">
                    <div>
                        <label style="color: #4fc3f7;">⚡ EV Пробег (Электро, км)</label>
                        <input type="number" id="ev_mileage" name="ev_mileage" value="0" min="0" oninput="calcTotalOdo()">
                    </div>
                    <div>
                        <label style="color: #ffb74d;">⛽ HEV Пробег (Гибрид/ДВС, км)</label>
                        <input type="number" id="hev_mileage" name="hev_mileage" value="0" min="0" oninput="calcTotalOdo()">
                    </div>
                    <div class="full-width">
                        <label style="color: #81c784;">📊 Общий пробег (ODO, км) *</label>
                        <input type="number" id="mileage" name="mileage" value="0" min="0" style="font-size: 16px; font-weight: bold; background: #1a271a; border-color: #4caf50;">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">✓ Сохранить и открыть Заказ-наряд</button>
        </form>
    </div>
</div>

<script>
function calcTotalOdo() {
    const ev = parseInt(document.getElementById('ev_mileage').value) || 0;
    const hev = parseInt(document.getElementById('hev_mileage').value) || 0;
    document.getElementById('mileage').value = ev + hev;
}
</script>

</body>
</html>
