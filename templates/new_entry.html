<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая приемка - BYD Service CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
        .card-custom { border-radius: 12px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid px-3">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-ev-front text-primary fs-4"></i>
                <span>BYD Service CRM</span>
            </a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i>Назад</a>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 800px;">
        <div class="card card-custom p-4">
            <h4 class="fw-bold mb-4"><i class="bi bi-file-earmark-plus text-primary me-2"></i>Новая приемка автомобиля</h4>
            <form action="/create-entry" method="post">
                <h6 class="text-primary fw-bold text-uppercase mb-3"><i class="bi bi-person me-2"></i>Данные владельца</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small text-muted">ФИО владельца *</label>
                        <input type="text" name="full_name" class="form-control" placeholder="Иванов Иван Иванович" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Номер телефона *</label>
                        <input type="tel" name="phone" class="form-control" placeholder="+998901234567" required>
                    </div>
                </div>

                <h6 class="text-primary fw-bold text-uppercase mb-3"><i class="bi bi-car-front me-2"></i>Данные автомобиля</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Марка / Модель *</label>
                        <input type="text" name="brand_model" class="form-control" value="BYD Song Plus EV" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Гос. номер *</label>
                        <input type="text" name="plate_number" class="form-control" placeholder="01 A 123 AA" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">VIN-код *</label>
                        <input type="text" name="vin_code" class="form-control" placeholder="LC0PE123456789012" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Тип двигателя *</label>
                        <select name="engine_type" class="form-select" required>
                            <option value="EV (Электро)">EV (Электро)</option>
                            <option value="DM-i (Гибрид)">DM-i (Гибрид)</option>
                            <option value="DM-p (Гибрид)">DM-p (Гибрид)</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Пробег (км)</label>
                        <input type="number" name="mileage" class="form-control" value="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Год выпуска</label>
                        <input type="number" name="manufacture_year" class="form-control" value="2023">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Здоровье АКБ (SOH %)</label>
                        <input type="number" step="0.1" name="soh_percent" class="form-control" value="100.0">
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="/" class="btn btn-light px-4">Отмена</a>
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Сохранить и сформировать акт</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
